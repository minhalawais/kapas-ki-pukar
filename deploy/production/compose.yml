name: kapas-production

services:
  caddy:
    profiles: [with-caddy]
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      PORTAL_HOST: ${PORTAL_HOST:?PORTAL_HOST is required}
      API_HOST: ${API_HOST:?API_HOST is required}
      TLS_ADMIN_EMAIL: ${TLS_ADMIN_EMAIL:?TLS_ADMIN_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      portal: { condition: service_healthy }
      api: { condition: service_healthy }
      tusd: { condition: service_healthy }

  portal:
    image: ${PORTAL_IMAGE:?PORTAL_IMAGE is required}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["3000"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      INTERNAL_API_URL: http://api:4000
      NEXT_PUBLIC_BACKEND_ENABLED: "true"
      NEXT_PUBLIC_ENABLE_DEMO_CREDENTIALS: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [edge, backend]

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["4000"]
    environment:
      NODE_ENV: production
      APP_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION is required}
      API_HOST: 0.0.0.0
      API_PORT: 4000
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:?PORTAL_ORIGIN is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY_COUNT: ${TRUST_PROXY_COUNT:-1}
      EVIDENCE_ROOT: /var/lib/kapas/evidence
      QUARANTINE_ROOT: /var/lib/kapas/quarantine
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:?ENCRYPTION_KEY_ID is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      IDENTITY_LOOKUP_PEPPER: ${IDENTITY_LOOKUP_PEPPER:?IDENTITY_LOOKUP_PEPPER is required}
      EVIDENCE_KEK_SECRET: ${EVIDENCE_KEK_SECRET:?EVIDENCE_KEK_SECRET is required}
      INTERNAL_METRICS_TOKEN: ${INTERNAL_METRICS_TOKEN:?INTERNAL_METRICS_TOKEN is required}
      PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:-}
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET:?TUSD_HOOK_SECRET is required}
      TUSD_PUBLIC_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}/files/
      TUSD_INTERNAL_URL: http://tusd:8080/files/
      OPENAPI_ENABLED: "false"
      QUEUE_PREFIX: ${QUEUE_PREFIX:-kapas-production}
      JSON_BODY_LIMIT_BYTES: ${JSON_BODY_LIMIT_BYTES:-1048576}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
    volumes:
      - evidence-data:/var/lib/kapas/evidence
      - quarantine-data:/var/lib/kapas/quarantine
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [edge, backend]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  minio:
    image: ${MINIO_IMAGE:?MINIO_IMAGE is required}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  minio-init:
    image: ${MINIO_IMAGE:?MINIO_IMAGE is required}
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/quarantine local/protected-evidence local/temporary
        mc anonymous set none local/quarantine
        mc anonymous set none local/protected-evidence
        mc anonymous set none local/temporary
    depends_on:
      minio: { condition: service_healthy }
    networks: [backend]

  hook-proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    environment:
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET:?TUSD_HOOK_SECRET is required}
    command:
      - caddy
      - reverse-proxy
      - --from
      - :8080
      - --to
      - api:4000
      - --header-up
      - "X-Tusd-Hook-Secret:{env.TUSD_HOOK_SECRET}"
    networks: [backend]
    depends_on:
      api: { condition: service_healthy }

  tusd:
    image: tusproject/tusd:v2.9.1
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    command:
      - -base-path=/files/
      - -behind-proxy
      - -disable-download
      - -max-size=26214400
      - -s3-bucket=quarantine
      - -s3-endpoint=http://minio:9000
      - -hooks-http=http://hook-proxy:8080/internal/tusd-hooks
      - -hooks-enabled-events=pre-create,post-create,post-receive,post-finish,post-terminate
      - -hooks-http-retry=5
      - -hooks-http-backoff=2s
      - -hooks-http-timeout=10s
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      AWS_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: "true"
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [backend, edge]
    depends_on:
      minio-init: { condition: service_completed_successfully }
      hook-proxy: { condition: service_started }

  clamav:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
      - /run/clamav
      - /var/log/clamav
      - /var/lock
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks: [backend]

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE is required}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    expose: ["4100"]
    environment:
      NODE_ENV: production
      APP_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION is required}
      API_HOST: 0.0.0.0
      API_PORT: 4000
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:?PORTAL_ORIGIN is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY_COUNT: "0"
      EVIDENCE_ROOT: /var/lib/kapas/evidence
      QUARANTINE_ROOT: /var/lib/kapas/quarantine
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:?ENCRYPTION_KEY_ID is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      IDENTITY_LOOKUP_PEPPER: ${IDENTITY_LOOKUP_PEPPER:?IDENTITY_LOOKUP_PEPPER is required}
      INTERNAL_METRICS_TOKEN: ${INTERNAL_METRICS_TOKEN:?INTERNAL_METRICS_TOKEN is required}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_HEALTH_PORT: 4100
      QUEUE_PREFIX: ${QUEUE_PREFIX:-kapas-production}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      QUARANTINE_BUCKET: quarantine
      PROTECTED_EVIDENCE_BUCKET: protected-evidence
      TEMPORARY_BUCKET: temporary
      EVIDENCE_KEK_SECRET: ${EVIDENCE_KEK_SECRET:?EVIDENCE_KEK_SECRET is required}
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET:?TUSD_HOOK_SECRET is required}
      EXPO_PUSH_ENABLED: ${EXPO_PUSH_ENABLED:-false}
      EXPO_PUSH_ACCESS_TOKEN: ${EXPO_PUSH_ACCESS_TOKEN:-}
    volumes:
      - evidence-data:/var/lib/kapas/evidence
      - quarantine-data:/var/lib/kapas/quarantine
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }
      minio: { condition: service_healthy }

  migrate:
    image: ${MIGRATE_IMAGE:?MIGRATE_IMAGE is required}
    restart: "no"
    profiles: [migrate]
    dns: [8.8.8.8, 1.1.1.1]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
      PRISMA_SCHEMA_ENGINE_BINARY: /workspace/node_modules/@prisma/engines/schema-engine-debian-openssl-3.0.x
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:18.0-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_MIGRATOR_USER:?POSTGRES_MIGRATOR_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:8.2.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

networks:
  edge:
  backend:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  evidence-data:
  quarantine-data:
  clamav-data:
  minio-data:
