name: Deploy production (VPS)

# CD pipeline: builds immutable images, pushes GHCR, SSH deploy + migrations.
# Triggers after green CI on main, or manual dispatch (hotfix).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag, or SHA)
        required: true
        default: main

concurrency:
  group: kapas-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  qualify:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Require deploy configuration
        run: |
          test -n "${{ secrets.DEPLOY_HOST }}" || { echo "Missing secret DEPLOY_HOST"; exit 1; }
          test -n "${{ secrets.DEPLOY_USER }}" || { echo "Missing secret DEPLOY_USER"; exit 1; }
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || { echo "Missing secret DEPLOY_SSH_KEY"; exit 1; }
          test -n "${{ vars.PRODUCTION_API_URL }}" || { echo "Missing variable PRODUCTION_API_URL"; exit 1; }
          test -n "${{ vars.PRODUCTION_API_HOST }}" || { echo "Missing variable PRODUCTION_API_HOST"; exit 1; }

  build-and-push:
    needs: qualify
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.meta.outputs.version }}
      image_namespace: ${{ steps.meta.outputs.namespace }}
      api_image: ${{ steps.meta.outputs.api_image }}
      worker_image: ${{ steps.meta.outputs.worker_image }}
      portal_image: ${{ steps.meta.outputs.portal_image }}
      migrate_image: ${{ steps.meta.outputs.migrate_image }}
      minio_image: ${{ steps.meta.outputs.minio_image }}
    steps:
      - name: Resolve deploy SHA
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha != '' && steps.ref.outputs.sha || steps.ref.outputs.ref }}

      - name: Image coordinates
        id: meta
        run: |
          NS="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          FULL_SHA="$(git rev-parse HEAD)"
          SHA="${FULL_SHA:0:12}"
          echo "namespace=${NS}" >> "$GITHUB_OUTPUT"
          echo "version=${SHA}" >> "$GITHUB_OUTPUT"
          echo "api_image=${REGISTRY}/${NS}/kapas-api:${SHA}" >> "$GITHUB_OUTPUT"
          echo "worker_image=${REGISTRY}/${NS}/kapas-worker:${SHA}" >> "$GITHUB_OUTPUT"
          echo "portal_image=${REGISTRY}/${NS}/kapas-portal:${SHA}" >> "$GITHUB_OUTPUT"
          echo "migrate_image=${REGISTRY}/${NS}/kapas-migrate:${SHA}" >> "$GITHUB_OUTPUT"
          echo "minio_image=${REGISTRY}/${NS}/kapas-minio:RELEASE.2025-10-15T17-29-55Z" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.namespace }}/kapas-api:latest

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.worker_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.namespace }}/kapas-worker:latest

      - name: Build and push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/database/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.migrate_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.namespace }}/kapas-migrate:latest

      - name: Build and push MinIO image
        uses: docker/build-push-action@v6
        with:
          context: deploy/minio
          file: deploy/minio/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.minio_image }}

      - name: Build and push portal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/puwf-portal/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PRODUCTION_API_URL }}
            NEXT_PUBLIC_BACKEND_ENABLED=true
            NEXT_PUBLIC_ENABLE_DEMO_CREDENTIALS=false
          tags: |
            ${{ steps.meta.outputs.portal_image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.namespace }}/kapas-portal:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy on VPS (pull images, migrate, restart stack)
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_VERSION: ${{ needs.build-and-push.outputs.release_version }}
          API_IMAGE: ${{ needs.build-and-push.outputs.api_image }}
          WORKER_IMAGE: ${{ needs.build-and-push.outputs.worker_image }}
          PORTAL_IMAGE: ${{ needs.build-and-push.outputs.portal_image }}
          MIGRATE_IMAGE: ${{ needs.build-and-push.outputs.migrate_image }}
          MINIO_IMAGE: ${{ needs.build-and-push.outputs.minio_image }}
          DEPLOY_REF: ${{ github.event.workflow_run.head_branch || github.event.inputs.ref || 'main' }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: RELEASE_VERSION,API_IMAGE,WORKER_IMAGE,PORTAL_IMAGE,MIGRATE_IMAGE,MINIO_IMAGE,DEPLOY_REF,DEPLOY_SHA
          script: |
            set -Eeuo pipefail
            if [ -n "${{ secrets.GHCR_PULL_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            fi
            install -d -m 700 /etc/kapas
            cat > /etc/kapas/image.env <<EOF
            RELEASE_VERSION=${RELEASE_VERSION}
            API_IMAGE=${API_IMAGE}
            WORKER_IMAGE=${WORKER_IMAGE}
            PORTAL_IMAGE=${PORTAL_IMAGE}
            MIGRATE_IMAGE=${MIGRATE_IMAGE}
            MINIO_IMAGE=${MINIO_IMAGE}
            EOF
            chmod 600 /etc/kapas/image.env
            export APP_ROOT="${{ vars.DEPLOY_APP_ROOT || '/opt/kapas' }}"
            export DEPLOY_REF="${DEPLOY_REF}"
            export DEPLOY_SHA="${DEPLOY_SHA}"
            bash "${APP_ROOT}/deploy/production/scripts/remote-deploy.sh"

      - name: Smoke check API
        run: |
          curl -fsS "https://${{ vars.PRODUCTION_API_HOST }}/api/v1/health/live"
          curl -fsS "https://${{ vars.PRODUCTION_API_HOST }}/api/v1/health/ready"

      - name: Smoke check public portal pages
        run: |
          PORTAL_HOST="${{ vars.PRODUCTION_PORTAL_HOST || 'kapaskipukar.com' }}"
          curl -fsS "https://${PORTAL_HOST}/privacy" | grep -qi "Privacy Policy"
          curl -fsS "https://${PORTAL_HOST}/support" | grep -qi "Support and data requests"
