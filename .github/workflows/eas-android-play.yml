name: EAS Android Play (AAB)

on:
  workflow_dispatch:

jobs:
  production-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build production AAB for Google Play
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SKIP_AUTO_FINGERPRINT: "1"
        run: npx --yes eas-cli@27.1.0 build --platform android --profile production --non-interactive --wait
